# ─────────────────────────────────────────────────────────────────────────────
# Perfil REVISIÓN DEL SECRETARIADO — la lista de candidatos a revisión manual.
#
# Reproduce la lógica del flujo que se mandaba al Secretariado: primero el script de
# R (motor estándar) y, sobre lo que éste dejaba SIN match, normalizar_folios (motor
# refinado), que propone para cada registro el mejor candidato del RNPDNO. Se
# comprobó contra `resultado_unificado_para_revision_30092026.xlsx`.
#
# Lo usa el notebook 8 (8_Revision_Secretariado). NO es para indicadores ni PPT:
# abre el universo del RNPDNO y quita una regla, así que sus matches no son los de
# `reporte_diario`. Tiene su propia llave de caché y no pisa a los otros perfiles.
# ─────────────────────────────────────────────────────────────────────────────
extends = "base"

# ── CAPA A · MATCHING ────────────────────────────────────────────────────────
# En cadena: cada motor recibe sólo lo que el anterior no resolvió (manual →
# estándar → refinado). Así el refinado propone candidatos únicamente para los
# registros que el estándar no emparejó, como cuando corría sobre la base
# "sin match" del script de R.
cascada_en_ejecucion = true

# Sin `regla_r_desfase_dias`: en R un match del estándar con fecha de hechos que
# difiere, o con FUB localizado, sigue siendo match, y ese registro no pasa al
# refinado. Se conserva `excluir_revision_manual`: un candidato no es un match.
reglas_post = ["excluir_revision_manual", "actualizar_rn_con_banci"]

# El refinado busca en TODO el RNPDNO: localizados y todos los años. En la lista
# de referencia, 1,811 candidatos son localizados y 777 son anteriores al sexenio.
filtrar_rnpdno_clasificacion = false
fecha_sexenio = "1900-01-01"

# BANCI: sólo los no localizados, como en la lista de referencia.
filtrar_banci_no_localizados = true

# ── CAPA C · REBANADAS ───────────────────────────────────────────────────────
estado = "nacional"
